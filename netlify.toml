[build]
  command = "npm run build"
  publish = "frontend/.next"

[build.environment]
  NODE_VERSION = "18"

# Configuração de Functions
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["backend/**", "!backend/node_modules/**"]
  
# Redirect API calls para Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback para Next.js
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

