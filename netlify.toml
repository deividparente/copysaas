[build]
  command = "cd backend && npm install && npx prisma generate && npx prisma migrate deploy && npm run seed && cd ../frontend && npm install && npm run build"
  publish = "frontend/.next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

# Configuração de Functions para API
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["backend/**", "!backend/node_modules/**", "!backend/.next/**"]
  
# Proxy API calls para Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Headers para CORS
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

# Headers para cache
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback para Next.js
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

